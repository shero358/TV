name: Android CI

on:
  push:
    branches: ["fongmi"]
  pull_request:
    branches: ["fongmi"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache Gradle directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/build.gradle*') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-gradle-

      - name: Install Android SDK commandline tools
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: |
          set -eux
          SDK_ROOT="$HOME/Android/Sdk"
          mkdir -p "$SDK_ROOT"
          cd /tmp
          CLI_ZIP="commandlinetools.zip"
          # If the URL expires, replace with the current commandlinetools package URL from Google.
          wget -q -O "$CLI_ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q "$CLI_ZIP" -d cmdline-tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/" || true
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          # Accept licenses (sdkmanager may close the pipe -> ignore return code)
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true
          # Install platform-tools and platform/build-tools matching project compileSdk
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        shell: bash

      - name: Create local.properties and temporary keystore for CI
        run: |
          set -eux
          SDK_DIR="$HOME/Android/Sdk"
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/ci-keystore.jks"
          KEY_ALIAS="ci-key"
          KEY_PASSWORD="android"
          STORE_PASSWORD="android"
          # generate keystore (so app's signingConfig can read local.properties during configuration)
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -dname "CN=CI,OU=CI,O=CI,L=CI,ST=CI,C=CN" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > local.properties <<EOF
                sdk.dir=${SDK_DIR}
                storeFile=${KEYSTORE_PATH}
                keyAlias=${KEY_ALIAS}
                storePassword=${STORE_PASSWORD}
                keyPassword=${KEY_PASSWORD}
                EOF
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        env:
          ANDROID_SDK_ROOT: $HOME/Android/Sdk
          ANDROID_HOME: $HOME/Android/Sdk
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: ./gradlew build --no-daemon --stacktrace --info
