name: Android CI

on:
  push:
    branches: ["fongmi"]
  pull_request:
    branches: ["fongmi"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Gradle directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', '**/build.gradle*') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-gradle-

      - name: Install Android SDK commandline tools
        env:
          # runner.home can be used in step-level expressions
          ANDROID_SDK_ROOT: ${{ runner.home }}/Android/Sdk
        run: |
          set -eux
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT"
          cd /tmp
          CLI_ZIP="commandlinetools.zip"
          # 如果链接失效，请替换为最新 commandlinetools 的 URL
          wget -q -O "$CLI_ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q "$CLI_ZIP" -d cmdline-tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/" || true
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        shell: bash

      - name: Create local.properties and temporary keystore for CI
        env:
          ANDROID_SDK_ROOT: ${{ runner.home }}/Android/Sdk
        run: |
          set -eux
          SDK_DIR="${ANDROID_SDK_ROOT}"
          KEYSTORE_PATH="${{ github.workspace }}/ci-keystore.jks"
          KEY_ALIAS="ci-key"
          KEY_PASSWORD="android"
          STORE_PASSWORD="android"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -dname "CN=CI,OU=CI,O=CI,L=CI,ST=CI,C=CN" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > local.properties <<EOF
                sdk.dir=${SDK_DIR}
                storeFile=${KEYSTORE_PATH}
                keyAlias=${KEY_ALIAS}
                storePassword=${STORE_PASSWORD}
                keyPassword=${KEY_PASSWORD}
                EOF

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        # 在 step-level env 中引用 steps.setup-java.outputs.java-home（此时 setup-java 已运行）
        env:
          ANDROID_SDK_ROOT: ${{ runner.home }}/Android/Sdk
          ANDROID_HOME: ${{ runner.home }}/Android/Sdk
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: ./gradlew build --no-daemon --stacktrace --info
