# Gradle JVM Configuration
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED

# Java version configuration
org.gradle.jvm.version=21

# JDK toolchain configuration - 在 CI 中接受任何供应商
# 禁用自动下载，但允许自动检测已安装的 JDK
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# 允许 Gradle 使用任何可用的 JDK 供应商（Temurin、OpenJDK、Oracle 等）
org.gradle.java.installations.paths=$JAVA_HOME

# Gradle daemon and build optimization
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
