# Gradle JVM Configuration
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED

# Java version configuration
org.gradle.jvm.version=21

# JDK toolchain configuration - Disable auto-detection and auto-download
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# Gradle daemon and build optimization
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
